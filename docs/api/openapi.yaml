            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUserListResponseDTO'
                required:
                - success
                - users
        '403':
          $ref: '#/components/responses/SecurityRejection'
        default:
          $ref: '#/components/responses/OtherError'
  /api/admin/users/pending:
    get:
      tags:
      - 관리자 사용자
      operationId: AdminUser_getPendingUsers
      summary: 승인 대기 사용자 목록
