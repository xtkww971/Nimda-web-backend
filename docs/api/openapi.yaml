  /api/admin/users/suggestions:
    get:
      tags:
      - 관리자 사용자
      operationId: AdminUser_getUserSuggestions
      summary: 사용자 선택 후보
      description: "관리자 권한이 필요합니다."
      security:
      - AuthorizationCookie: []
      responses:
        '200':
          description: 정상 응답
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserSuggestionResponseDTO'
                required:
                - success
                - users
        '403':
          $ref: '#/components/responses/SecurityRejection'
        default:
          $ref: '#/components/responses/OtherError'
  /api/admin/users/tag-delete/{tag}:
    post:
      tags:
      - 관리자 사용자
      operationId: AdminUser_deleteTag
      summary: 태그 문자열 반환
      description: "관리자 권한이 필요합니다."
      security:
      - AuthorizationCookie: []
      responses:
        '200':
          description: "태그 문자열을 반환합니다. 삭제는 수행하지 않습니다."
          content:
            text/plain:
              schema:
                type: string
              example: sample-tag
        '403':
          $ref: '#/components/responses/SecurityRejection'
        default:
          $ref: '#/components/responses/OtherError'
      parameters:
      - name: tag
        in: path
        required: true
        schema:
          type: string
  /api/admin/users/{id}:
