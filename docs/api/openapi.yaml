          description: 정상 응답
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUserListResponseDTO'
