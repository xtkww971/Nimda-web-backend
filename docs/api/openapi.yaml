  /api/alarm/subscribe:
    get:
      tags:
      - SSE 알림
      operationId: Alarm_subscribe
      summary: 알림 스트림 구독
      description: "로그인이 필요합니다."
      security:
      - AuthorizationCookie: []
      responses:
        '200':
          description: "SSE 스트림. connect 이벤트 뒤 notification 이벤트를 전달합니다."
          content:
            text/event-stream:
              schema:
                type: string
              example: 'event:connect

                data:Connected to SSE


                event:notification

                data:{"id":1,"message":"알림 예시"}


                '
        '403':
          $ref: '#/components/responses/SecurityRejection'
        default:
          $ref: '#/components/responses/OtherError'
  /api/auth/email-hide:
