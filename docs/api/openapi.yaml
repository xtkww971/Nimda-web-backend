openapi: 3.1.0
info:
  title: "Nimda Backend API"
  version: baseline-ed56b70
  description: "Nimda 웹 서비스 API."
servers:
- url: http://127.0.0.1:8080
  description: "로컬 백엔드"
tags:
- name: 인증·내 프로필
- name: 비밀번호 복구
- name: 사용자 공개 프로필
- name: 관리자 사용자
- name: SSE 알림
- name: 첨부파일
- name: 출석
- name: 관리자 게시글
- name: 게시글
- name: 카테고리
- name: 댓글
- name: 게시글 좋아요
- name: 댓글 좋아요
- name: 알림
- name: 포인트
- name: 상품 구매
- name: 프로필 장식
- name: 태그
- name: CTF 문제 관리
- name: CTF 문제 조회
- name: CTF 다운로드
- name: 관리자 CTF 팀
- name: 내 CTF 팀
- name: 그룹
- name: 그룹 가입·초대
- name: 그룹 멤버
- name: CTF 서버 상태
- name: CTF 인스턴스
- name: CTF 점수판
- name: CTF 플래그 제출
- name: 로컬 파일 다운로드
paths:
  /api/admin/boards/activate-by-tag:
    put:
      tags:
      - 관리자 게시글
      operationId: AdminBoard_activateByTag
      summary: 태그별 게시글 활성화
      description: "관리자 권한이 필요합니다."
      security:
      - AuthorizationCookie: []
      responses:
        '200':
          description: 정상 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardTagStatusUpdateResponseDTO'
        '403':
          $ref: '#/components/responses/SecurityRejection'
        default:
          $ref: '#/components/responses/OtherError'
      parameters:
      - name: categoryId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: tagId
        in: query
        required: true
        schema:
          type: integer
          format: int64
  /api/admin/boards/deactivate-by-tag:
    put:
      tags:
      - 관리자 게시글
      operationId: AdminBoard_deactivateByTag
      summary: 태그별 게시글 비활성화
      description: "관리자 권한이 필요합니다."
      security:
      - AuthorizationCookie: []
      responses:
        '200':
          description: 정상 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardTagStatusUpdateResponseDTO'
        '403':
          $ref: '#/components/responses/SecurityRejection'
        default:
          $ref: '#/components/responses/OtherError'
      parameters:
      - name: categoryId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: tagId
        in: query
        required: true
        schema:
          type: integer
          format: int64
  /api/admin/boards/tag-stats:
    get:
      tags:
      - 관리자 게시글
      operationId: AdminBoard_getTagStats
      summary: 태그별 게시글 통계
      description: "관리자 권한이 필요합니다."
      security:
      - AuthorizationCookie: []
      responses:
        '200':
          description: 정상 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardTagStatsResponseDTO'
        '403':
          $ref: '#/components/responses/SecurityRejection'
        default:
          $ref: '#/components/responses/OtherError'
      parameters:
      - name: categoryId
        in: query
        required: true
        schema:
          type: integer
          format: int64
  /api/admin/ctf/teams:
    get:
      tags:
      - 관리자 CTF 팀
      operationId: AdminTeam_getTeams
      summary: CTF 팀 목록
      description: "관리자 권한이 필요합니다."
      security:
      - AuthorizationCookie: []
      responses:
        '200':
          description: 정상 응답
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                    enum:
                    - 팀 목록을 조회하였습니다.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TeamResponse'
                required:
                - success
                - message
                - data
        '403':
          $ref: '#/components/responses/SecurityRejection'
        default:
          $ref: '#/components/responses/OtherError'
    post:
      tags:
      - 관리자 CTF 팀
      operationId: AdminTeam_createTeam
      summary: CTF 팀 생성
      description: "관리자 권한이 필요합니다."
      security:
      - AuthorizationCookie: []
      responses:
        '201':
          description: 정상 응답
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                    enum:
                    - 팀이 생성되었습니다.
                  data:
                    $ref: '#/components/schemas/TeamResponse'
                required:
                - success
                - message
                - data
        '403':
          $ref: '#/components/responses/SecurityRejection'
        default:
          $ref: '#/components/responses/OtherError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreateRequest'
            example:
              name: 예시 팀
              capacity: 5
              leaderUserId: 1
              memberUserIds:
              - 2
              - 3
  /api/admin/ctf/teams/unassigned:
    get:
      tags:
      - 관리자 CTF 팀
      operationId: AdminTeam_getUnassignedUsers
      summary: 미배정 참가자 목록
      description: "관리자 권한이 필요합니다."
      security:
      - AuthorizationCookie: []
      responses:
        '200':
          description: 정상 응답
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                    enum:
                    - 미배정 참가자를 조회하였습니다.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UnassignedUserResponse'
                required:
                - success
                - message
                - data
        '403':
          $ref: '#/components/responses/SecurityRejection'
        default:
          $ref: '#/components/responses/OtherError'
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type: string
  /api/admin/ctf/teams/{teamId}:
    get:
      tags:
      - 관리자 CTF 팀
      operationId: AdminTeam_getTeam
      summary: CTF 팀 상세
      description: "관리자 권한이 필요합니다."
      security:
      - AuthorizationCookie: []
      responses:
        '200':
          description: 정상 응답
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                    enum:
                    - 팀을 조회하였습니다.
                  data:
                    $ref: '#/components/schemas/TeamResponse'
                required:
                - success
                - message
                - data
        '403':
          $ref: '#/components/responses/SecurityRejection'
        default:
          $ref: '#/components/responses/OtherError'
      parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      tags:
      - 관리자 CTF 팀
      operationId: AdminTeam_updateTeam
      summary: CTF 팀 수정
      description: "관리자 권한이 필요합니다."
      security:
      - AuthorizationCookie: []
      responses:
        '200':
          description: 정상 응답
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                    enum:
                    - 팀이 수정되었습니다.
                  data:
                    $ref: '#/components/schemas/TeamResponse'
                required:
                - success
                - message
                - data
        '403':
          $ref: '#/components/responses/SecurityRejection'
        default:
          $ref: '#/components/responses/OtherError'
      parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupUpdateRequest'
    delete:
      tags:
      - 관리자 CTF 팀
      operationId: AdminTeam_deleteTeam
      summary: CTF 팀 삭제
      description: "관리자 권한이 필요합니다."
      security:
      - AuthorizationCookie: []
      responses:
        '200':
          description: 정상 응답
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                    enum:
                    - 팀이 삭제되었습니다.
                required:
                - success
                - message
        '403':
          $ref: '#/components/responses/SecurityRejection'
        default:
          $ref: '#/components/responses/OtherError'
      parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: integer
          format: int64
  /api/admin/ctf/teams/{teamId}/leader:
    patch:
      tags:
      - 관리자 CTF 팀
      operationId: AdminTeam_changeLeader
      summary: CTF 팀장 변경
      description: "관리자 권한이 필요합니다."
      security:
      - AuthorizationCookie: []
      responses:
        '200':
          description: 정상 응답
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                    enum:
                    - 팀장이 변경되었습니다.
                  data:
                    $ref: '#/components/schemas/TeamResponse'
                required:
                - success
                - message
                - data
        '403':
          $ref: '#/components/responses/SecurityRejection'
        default:
          $ref: '#/components/responses/OtherError'
      parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamLeaderRequest'
            example:
              userId: 2
  /api/admin/ctf/teams/{teamId}/members:
    post:
      tags:
      - 관리자 CTF 팀
      operationId: AdminTeam_addMember
      summary: CTF 팀 멤버 추가
      description: "관리자 권한이 필요합니다."
      security:
      - AuthorizationCookie: []
      responses:
        '201':
          description: 정상 응답
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                    enum:
                    - 멤버가 배정되었습니다.
                  data:
                    $ref: '#/components/schemas/TeamResponse'
                required:
                - success
                - message
                - data
        '403':
          $ref: '#/components/responses/SecurityRejection'
        default:
          $ref: '#/components/responses/OtherError'
      parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamMemberAddRequest'
            example:
              userIds:
              - 2
              - 3
  /api/admin/ctf/teams/{teamId}/members/{userId}:
    delete:
      tags:
      - 관리자 CTF 팀
      operationId: AdminTeam_removeMember
      summary: CTF 팀 멤버 제거
