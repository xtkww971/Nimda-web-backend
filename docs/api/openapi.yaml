                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                    enum:
                    - 멤버가 제거되었습니다.
                  data:
                    $ref: '#/components/schemas/TeamResponse'
                required:
                - success
                - message
                - data
        '403':
          $ref: '#/components/responses/SecurityRejection'
        default:
          $ref: '#/components/responses/OtherError'
      parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
  /api/admin/users:
    get:
      tags:
      - 관리자 사용자
      operationId: AdminUser_getAllUsers
      summary: 전체 사용자 목록
      description: "관리자 권한이 필요합니다."
