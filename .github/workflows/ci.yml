name: Nimda CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃 소스코드
        uses: actions/checkout@v4

      - name: JDK 17 세팅
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          dependency-path: 'backend-spring/pom.xml'

      - name: 깃 해시 추출
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: 메이븐 빌드 (테스트 제외)
        run: mvn clean package -DskipTests
        working-directory: backend-spring

      - name: 도커허브 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: 도커 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./backend-spring
          file: ./backend-spring/Dockerfile
          push: true
          tags: |
            xtkww971/nimda-backend:latest
            xtkww971/nimda-backend:${{ steps.vars.outputs.sha_short }}

      # 서버 compose는 레포 파일로만 정한다. 서버에서 손으로 고치면 다음 배포에 덮어써진다.
      # nginx/nginx.conf는 와일드카드 인증서(RB-0001 단계 5)가 준비된 뒤에 여기에 추가한다.
      - name: 배포 매니페스트 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy.sh,docker-compose.yml"
          target: "/home/ubuntu/app"


      - name: 운영 서버 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/app
            chmod +x deploy.sh
            ./deploy.sh