name: Nimda CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 테스트용 Redis. 컨텍스트 로딩 테스트와 RedisTest가 localhost:6379(application-test.yml)에 붙는다.
    services:
      redis:
        image: redis:7.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: 체크아웃 소스코드
        uses: actions/checkout@v4

      - name: JDK 17 세팅
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          dependency-path: 'backend-spring/pom.xml'

      - name: 깃 해시 추출
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # 테스트가 하나라도 실패하면 여기서 멈추고 이미지 빌드·배포로 넘어가지 않는다.
      # Dockerfile의 -DskipTests는 이 단계를 통과한 소스를 다시 패키징만 하는 것이라 그대로 둔다.
      - name: 메이븐 빌드 및 테스트
        run: mvn -B clean package
        working-directory: backend-spring
        env:
          REDIS_INTEGRATION_TEST: "true"

      - name: 테스트 리포트 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend-spring/target/surefire-reports
          retention-days: 7

      - name: 도커허브 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: 도커 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./backend-spring
          file: ./backend-spring/Dockerfile
          push: true
          tags: |
            xtkww971/nimda-backend:latest
            xtkww971/nimda-backend:${{ steps.vars.outputs.sha_short }}

      # 서버 compose는 레포 파일로만 정한다. 서버에서 손으로 고치면 다음 배포에 덮어써진다.
      # nginx.conf의 인스턴스 블록은 와일드카드 인증서(live/nimda.kr, RB-0001 단계 5)를 참조한다.
      # 서버에 인증서가 있어야 한다. 없으면 deploy.sh의 nginx -t가 막고 기존 설정을 유지한다.
      # nginx/conf.d(active-backend.inc)는 서버가 관리하는 상태라 보내지 않는다.
      - name: 배포 매니페스트 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy.sh,docker-compose.yml,nginx/nginx.conf,scripts/certbot-dns-hook.sh"
          target: "/home/ubuntu/app"


      - name: 운영 서버 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/app
            chmod +x deploy.sh
            ./deploy.sh