version: '3.8'

# 모든 컨테이너의 로그 크기 상한. 서버 Docker에는 기본 제한이 없어(daemon.json 없음) 로그가 디스크를 끝없이 채울 수 있다.
# 컨테이너마다 10MB × 3개(최대 30MB)까지만 남기고 오래된 것부터 지운다. 바꾸면 해당 컨테이너가 다시 만들어진다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    container_name: nimda-mysql
    networks:
      - nimda-network
    restart: always
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # 메모리 설정 (1GB RAM 서버). mysql 이미지는 서버 설정을 환경변수로 받지 않으므로 command로 넘긴다.
    # 2026-11 실측: 데이터 3.4MB, 최대 동시 연결 9개, performance_schema가 혼자 230MiB를 써서 MySQL이 약 430MB(대부분 스왑)를 차지했다.
    # 로컬 검증: 같은 데이터와 부하에서 RSS 418MB → 162MB, 쿼리 처리 시간 차이 3% 이내.
    command:
      - --performance-schema=OFF          # 230MiB 절약. 쿼리 분석이 필요하면 슬로우 쿼리 로그를 쓴다
      - --innodb-buffer-pool-size=64M     # 데이터 대비 충분 (기본 128M 중 24MB만 쓰고 있었다)
      - --innodb-log-buffer-size=8M       # 기본 16M
      - --max-connections=40              # 기본 151. Hikari 풀 5개 × blue/green 2개 + 여유
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
    expose:
      - "3306" # DB 외부 접근 차단
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    container_name: nimda-redis
    restart: always
    logging: *default-logging
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "172.26.5.231:6379:6379"
    networks:
      - nimda-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 기존 서버
  backend-blue:
    image: xtkww971/nimda-backend:latest
    container_name: backend-blue
    # DB 실행 조건 설정
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 내부 컨테이너만 접근 가능하게 설정
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - nimda-network
      # CTF 인스턴스(컨테이너 이름:EXPOSE 포트)로 프록시하려면 같은 망에 있어야 한다.
      - ctf-instances
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:8080/error" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

    environment:
      # 시간대 설정
      - TZ=Asia/Seoul
      # JVM 메모리 측정용 GC 로그 (힙 상한은 아직 기본값 그대로, 911MB의 1/4 ≈ 228MiB).
      # GC 직후 힙(살아 있는 데이터)과 Metaspace 크기를 모아 -Xmx를 정한다. 보기: docker exec backend-blue tail /tmp/gc.log
      # 서버의 Docker 로그는 크기 제한이 없어서 stdout 대신 컨테이너 안 파일에 5MB × 5개로 돌려 쓴다.
      - JAVA_TOOL_OPTIONS=-Xlog:gc,gc+metaspace:file=/tmp/gc.log:time,uptime,level,tags:filecount=5,filesize=5M
      # MySQL
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      # Redis (CTF 요청·결과·소유자 매핑). 운영 redis는 --requirepass라 비밀번호가 필수다.
      # 컨테이너 안에서 보는 주소라 서비스 이름으로 고정한다(.env의 localhost는 IDE 실행용).
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      # Spring Boot 포트 설정
      - SERVER_PORT=8080
      # AWS S3 설정
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_S3_REGION=${AWS_S3_REGION}
      - AWS_S3_ACCESS_KEY=${AWS_S3_ACCESS_KEY}
      - AWS_S3_SECRET_KEY=${AWS_S3_SECRET_KEY}
      # JWT 토큰 설정
      - JWT_SECRET=${JWT_SECRET}
      # Spring Security 기본 계정. application.yml에 기본값이 없어 빠지면 기동이 실패한다.
      - SPRING_SECURITY_USER_NAME=${SPRING_SECURITY_USER_NAME}
      - SPRING_SECURITY_USER_PASSWORD=${SPRING_SECURITY_USER_PASSWORD}
      # 이메일 설정
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      # CTF 인스턴스 서브도메인 프록시 (inst-{uuid}.{도메인}). 비어 있으면 꺼진다.
      - CTF_INSTANCE_BASE_DOMAIN=${CTF_INSTANCE_BASE_DOMAIN:-}
      # CTF 서버(EC2) 인스턴스 게이트웨이 "사설IP:포트" (VPC peering). 비어 있으면 결과 host:port로 직접 붙는다.
      - CTF_INSTANCE_GATEWAY=${CTF_INSTANCE_GATEWAY:-}
      # 인증 쿠키를 인스턴스 서브도메인에도 보내려면 상위 도메인을 건다. 비어 있으면 host-only.
      - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN:-}
    restart: always
    logging: *default-logging

  backend-green:
    image: xtkww971/nimda-backend:latest
    container_name: backend-green
    networks:
      - nimda-network
      - ctf-instances
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:8080/error" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - TZ=Asia/Seoul
      # JVM 메모리 측정용 GC 로그. backend-blue 의 설명 참고
      - JAVA_TOOL_OPTIONS=-Xlog:gc,gc+metaspace:file=/tmp/gc.log:time,uptime,level,tags:filecount=5,filesize=5M
      # MySQL 연결 정보
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      # Redis (CTF 요청·결과·소유자 매핑). 운영 redis는 --requirepass라 비밀번호가 필수다.
      # 컨테이너 안에서 보는 주소라 서비스 이름으로 고정한다(.env의 localhost는 IDE 실행용).
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      # Spring Boot 포트 설정
      - SERVER_PORT=8080
      # AWS S3 설정
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_S3_REGION=${AWS_S3_REGION}
      - AWS_S3_ACCESS_KEY=${AWS_S3_ACCESS_KEY}
      - AWS_S3_SECRET_KEY=${AWS_S3_SECRET_KEY}
      # JWT 토큰 설정
      - JWT_SECRET=${JWT_SECRET}
      # Spring Security 기본 계정. application.yml에 기본값이 없어 빠지면 기동이 실패한다.
      - SPRING_SECURITY_USER_NAME=${SPRING_SECURITY_USER_NAME}
      - SPRING_SECURITY_USER_PASSWORD=${SPRING_SECURITY_USER_PASSWORD}
      # 이메일 설정
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      # CTF 인스턴스 서브도메인 프록시 (inst-{uuid}.{도메인}). 비어 있으면 꺼진다.
      - CTF_INSTANCE_BASE_DOMAIN=${CTF_INSTANCE_BASE_DOMAIN:-}
      # CTF 서버(EC2) 인스턴스 게이트웨이 "사설IP:포트" (VPC peering). 비어 있으면 결과 host:port로 직접 붙는다.
      - CTF_INSTANCE_GATEWAY=${CTF_INSTANCE_GATEWAY:-}
      # 인증 쿠키를 인스턴스 서브도메인에도 보내려면 상위 도메인을 건다. 비어 있으면 host-only.
      - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN:-}
    restart: always
    logging: *default-logging

  nginx:
    image: nginx:alpine
    container_name: nimda-nginx
    depends_on:
      - backend-blue
      - backend-green
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
    networks:
      - nimda-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro # nginx 설정 파일 마운트
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      # blue - green의 주소가 담긴 설정 파일
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    restart: always
    logging: *default-logging

# 볼륨 정의 (데이터 영속성)
volumes:
  mysql_data:
  redis_data:
  certbot-www: # Let's Encrypt 인증용 웹루트
  certbot-conf: # Let's Encrypt 인증서 저장소

# 도커 컨테이너 네트워크 설정
networks:
  nimda-network:
    # 이름을 고정해야 Judge Server compose가 external로 이 망에 붙는다.
    # (기본값은 프로젝트명이 붙어 {프로젝트}_nimda-network가 된다)
    name: nimda-network
    driver: bridge
  # CTF 인스턴스 망. backend가 만들고 Judge Server는 이름으로 붙기만 한다.
  # backend는 Judge Server 없이도 떠야 하므로 external로 두지 않는다.
  # internal이라 이 망에 붙은 인스턴스 컨테이너는 밖으로 나가지 못한다.
  ctf-instances:
    name: ctf-instances
    driver: bridge
    internal: true