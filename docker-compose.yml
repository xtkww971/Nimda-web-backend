version: '3.8'

# 모든 컨테이너의 로그 크기 상한. 서버 Docker에는 기본 제한이 없어(daemon.json 없음) 로그가 디스크를 끝없이 채울 수 있다.
# 컨테이너마다 10MB × 3개(최대 30MB)까지만 남기고 오래된 것부터 지운다. 바꾸면 해당 컨테이너가 다시 만들어진다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    container_name: nimda-mysql
    networks:
      - nimda-network
    restart: always
    # 컨테이너 메모리 한도. 넘으면 MySQL 만 다시 뜨고 다른 서비스는 그대로다 (예전엔 OOM 때 커널이 MySQL 을 골라 죽였다).
    # 2026-11-18 실측(아래 설정 적용 뒤): 평소 RAM 25MB + 스왑 127MB, 최대 RAM 155MB.
    # 설정상 상한(버퍼 풀 64M + 로그 버퍼 8M + 연결 40개분 버퍼)보다 넉넉하게 잡았다.
    mem_limit: 256m
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # 메모리 설정 (1GB RAM 서버). mysql 이미지는 서버 설정을 환경변수로 받지 않으므로 command로 넘긴다.
    # 2026-11 실측: 데이터 3.4MB, 최대 동시 연결 9개, performance_schema가 혼자 230MiB를 써서 MySQL이 약 430MB(대부분 스왑)를 차지했다.
    # 로컬 검증: 같은 데이터와 부하에서 RSS 418MB → 162MB, 쿼리 처리 시간 차이 3% 이내.
    command:
      - --performance-schema=OFF          # 230MiB 절약. 쿼리 분석이 필요하면 슬로우 쿼리 로그를 쓴다
      - --innodb-buffer-pool-size=64M     # 데이터 대비 충분 (기본 128M 중 24MB만 쓰고 있었다)
      - --innodb-log-buffer-size=8M       # 기본 16M
      - --max-connections=40              # 기본 151. Hikari 풀 5개 × blue/green 2개 + 여유
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
    expose:
      - "3306" # DB 외부 접근 차단
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    container_name: nimda-redis
    restart: always
    # 실측: 평소 2MB, 최대 RAM 7MB. CTF 요청·결과 큐와 인스턴스 소유자 매핑이 있어 Redis maxmemory(넘치면 키를 지움)는
    # 걸지 않고 컨테이너 한도만 둔다. 넘으면 Redis 만 다시 뜬다 (데이터는 redis_data 볼륨).
    mem_limit: 64m
    logging: *default-logging
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "172.26.5.231:6379:6379"
    networks:
      - nimda-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 기존 서버
  backend-blue:
    image: xtkww971/nimda-backend:latest
    container_name: backend-blue
    # DB 실행 조건 설정
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 내부 컨테이너만 접근 가능하게 설정
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - nimda-network
      # CTF 인스턴스(컨테이너 이름:EXPOSE 포트)로 프록시하려면 같은 망에 있어야 한다.
      - ctf-instances
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:8080/error" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

    environment:
      # 시간대 설정
      - TZ=Asia/Seoul
      # JVM 메모리 상한. 24시간 GC 로그 실측(2026-11-16~17): GC 직후 힙 최대 80MB, 잡아 둔 힙 최대 135MB,
      # Metaspace 126MB, 스레드 41개. 상한이 없으면 힙이 911MB의 1/4(≈228MiB)까지 커질 수 있고,
      # 실제로 Java 메모리 대부분이 스왑에 밀려 평소 Young GC 가 1.7초씩 멈췄다.
      #   -Xmx160m                  실사용 최대(80MB)의 2배
      #   MaxMetaspaceSize=192m     지금 126MB이고 조금씩 늘고 있어 여유를 둔다
      #   ReservedCodeCacheSize=64m 기본 240MB 예약을 줄인다 (Spring Boot 는 보통 30~50MB 사용)
      #   ExitOnOutOfMemoryError    OOM 이면 바로 죽고 restart: always 로 다시 뜬다 (반쯤 죽은 채 버티지 않게)
      # GC 로그는 상한을 건 뒤에도 확인하려고 남긴다 (컨테이너 안 파일, 5MB × 5). 보기: docker exec backend-blue tail /tmp/gc.log
      - JAVA_TOOL_OPTIONS=-Xmx160m -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=64m -XX:+ExitOnOutOfMemoryError -Xlog:gc,gc+metaspace:file=/tmp/gc.log:time,uptime,level,tags:filecount=5,filesize=5M
      # MySQL
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      # Redis (CTF 요청·결과·소유자 매핑). 운영 redis는 --requirepass라 비밀번호가 필수다.
      # 컨테이너 안에서 보는 주소라 서비스 이름으로 고정한다(.env의 localhost는 IDE 실행용).
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      # Spring Boot 포트 설정
      - SERVER_PORT=8080
      # AWS S3 설정
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_S3_REGION=${AWS_S3_REGION}
      - AWS_S3_ACCESS_KEY=${AWS_S3_ACCESS_KEY}
      - AWS_S3_SECRET_KEY=${AWS_S3_SECRET_KEY}
      # JWT 토큰 설정
      - JWT_SECRET=${JWT_SECRET}
      # Spring Security 기본 계정. application.yml에 기본값이 없어 빠지면 기동이 실패한다.
      - SPRING_SECURITY_USER_NAME=${SPRING_SECURITY_USER_NAME}
      - SPRING_SECURITY_USER_PASSWORD=${SPRING_SECURITY_USER_PASSWORD}
      # 이메일 설정
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      # CTF 인스턴스 서브도메인 프록시 (inst-{uuid}.{도메인}). 비어 있으면 꺼진다.
      - CTF_INSTANCE_BASE_DOMAIN=${CTF_INSTANCE_BASE_DOMAIN:-}
      # CTF 서버(EC2) 인스턴스 게이트웨이 "사설IP:포트" (VPC peering). 비어 있으면 결과 host:port로 직접 붙는다.
      - CTF_INSTANCE_GATEWAY=${CTF_INSTANCE_GATEWAY:-}
      # 인증 쿠키를 인스턴스 서브도메인에도 보내려면 상위 도메인을 건다. 비어 있으면 host-only.
      - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN:-}
    restart: always
    # 힙 160 + Metaspace 약 130 + 코드 캐시 약 50 + 스레드·GC·네이티브 약 60 ≈ 400MB.
    # 넘으면 이 컨테이너만 죽고 다시 뜬다 (MySQL 이 대신 OOM 으로 죽지 않게).
    mem_limit: 512m
    logging: *default-logging

  backend-green:
    image: xtkww971/nimda-backend:latest
    container_name: backend-green
    networks:
      - nimda-network
      - ctf-instances
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:8080/error" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - TZ=Asia/Seoul
      # JVM 메모리 상한 + GC 로그. backend-blue 의 설명 참고 (두 값은 항상 같게 둔다)
      - JAVA_TOOL_OPTIONS=-Xmx160m -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=64m -XX:+ExitOnOutOfMemoryError -Xlog:gc,gc+metaspace:file=/tmp/gc.log:time,uptime,level,tags:filecount=5,filesize=5M
      # MySQL 연결 정보
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      # Redis (CTF 요청·결과·소유자 매핑). 운영 redis는 --requirepass라 비밀번호가 필수다.
      # 컨테이너 안에서 보는 주소라 서비스 이름으로 고정한다(.env의 localhost는 IDE 실행용).
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      # Spring Boot 포트 설정
      - SERVER_PORT=8080
      # AWS S3 설정
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_S3_REGION=${AWS_S3_REGION}
      - AWS_S3_ACCESS_KEY=${AWS_S3_ACCESS_KEY}
      - AWS_S3_SECRET_KEY=${AWS_S3_SECRET_KEY}
      # JWT 토큰 설정
      - JWT_SECRET=${JWT_SECRET}
      # Spring Security 기본 계정. application.yml에 기본값이 없어 빠지면 기동이 실패한다.
      - SPRING_SECURITY_USER_NAME=${SPRING_SECURITY_USER_NAME}
      - SPRING_SECURITY_USER_PASSWORD=${SPRING_SECURITY_USER_PASSWORD}
      # 이메일 설정
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      # CTF 인스턴스 서브도메인 프록시 (inst-{uuid}.{도메인}). 비어 있으면 꺼진다.
      - CTF_INSTANCE_BASE_DOMAIN=${CTF_INSTANCE_BASE_DOMAIN:-}
      # CTF 서버(EC2) 인스턴스 게이트웨이 "사설IP:포트" (VPC peering). 비어 있으면 결과 host:port로 직접 붙는다.
      - CTF_INSTANCE_GATEWAY=${CTF_INSTANCE_GATEWAY:-}
      # 인증 쿠키를 인스턴스 서브도메인에도 보내려면 상위 도메인을 건다. 비어 있으면 host-only.
      - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN:-}
    restart: always
    # backend-blue 의 설명 참고
    mem_limit: 512m
    logging: *default-logging

  nginx:
    image: nginx:alpine
    container_name: nimda-nginx
    depends_on:
      - backend-blue
      - backend-green
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
    networks:
      - nimda-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro # nginx 설정 파일 마운트
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      # blue - green의 주소가 담긴 설정 파일
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    restart: always
    # 실측: 평소 4MB (워커 2개). 접속이 몰려도 연결당 수 KB 라 넉넉하다
    mem_limit: 64m
    logging: *default-logging

# 볼륨 정의 (데이터 영속성)
volumes:
  mysql_data:
  redis_data:
  certbot-www: # Let's Encrypt 인증용 웹루트
  certbot-conf: # Let's Encrypt 인증서 저장소

# 도커 컨테이너 네트워크 설정
networks:
  nimda-network:
    # 이름을 고정해야 Judge Server compose가 external로 이 망에 붙는다.
    # (기본값은 프로젝트명이 붙어 {프로젝트}_nimda-network가 된다)
    name: nimda-network
    driver: bridge
  # CTF 인스턴스 망. backend가 만들고 Judge Server는 이름으로 붙기만 한다.
  # backend는 Judge Server 없이도 떠야 하므로 external로 두지 않는다.
  # internal이라 이 망에 붙은 인스턴스 컨테이너는 밖으로 나가지 못한다.
  ctf-instances:
    name: ctf-instances
    driver: bridge
    internal: true