version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: nimda-mysql
    networks:
      - nimda-network
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # 메모리 설정 최적화 (1GB RAM 환경)
      MYSQL_INNODB_BUFFER_POOL_SIZE: 256M
    expose:
      - "3306" # DB 외부 접근 차단
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    container_name: nimda-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "172.26.5.231:6379:6379"
    networks:
      - nimda-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 기존 서버
  backend-blue:
    image: xtkww971/nimda-backend:latest
    container_name: backend-blue
    # DB 실행 조건 설정
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 내부 컨테이너만 접근 가능하게 설정
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - nimda-network
      # CTF 인스턴스(컨테이너 이름:EXPOSE 포트)로 프록시하려면 같은 망에 있어야 한다.
      - ctf-instances
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:8080/error" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

    environment:
      # 시간대 설정
      - TZ=Asia/Seoul
      # MySQL
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      # Redis (CTF 요청·결과·소유자 매핑). 운영 redis는 --requirepass라 비밀번호가 필수다.
      # 컨테이너 안에서 보는 주소라 서비스 이름으로 고정한다(.env의 localhost는 IDE 실행용).
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      # Spring Boot 포트 설정
      - SERVER_PORT=8080
      # AWS S3 설정
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_S3_REGION=${AWS_S3_REGION}
      - AWS_S3_ACCESS_KEY=${AWS_S3_ACCESS_KEY}
      - AWS_S3_SECRET_KEY=${AWS_S3_SECRET_KEY}
      # JWT 토큰 설정
      - JWT_SECRET=${JWT_SECRET}
      # 이메일 설정
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      # CTF 인스턴스 서브도메인 프록시 (inst-{uuid}.{도메인}). 비어 있으면 꺼진다.
      - CTF_INSTANCE_BASE_DOMAIN=${CTF_INSTANCE_BASE_DOMAIN:-}
      # 인증 쿠키를 인스턴스 서브도메인에도 보내려면 상위 도메인을 건다. 비어 있으면 host-only.
      - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN:-}
    restart: always

  backend-green:
    image: xtkww971/nimda-backend:latest
    container_name: backend-green
    networks:
      - nimda-network
      - ctf-instances
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:8080/error" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - TZ=Asia/Seoul
      # MySQL 연결 정보
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      # Redis (CTF 요청·결과·소유자 매핑). 운영 redis는 --requirepass라 비밀번호가 필수다.
      # 컨테이너 안에서 보는 주소라 서비스 이름으로 고정한다(.env의 localhost는 IDE 실행용).
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      # Spring Boot 포트 설정
      - SERVER_PORT=8080
      # AWS S3 설정
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_S3_REGION=${AWS_S3_REGION}
      - AWS_S3_ACCESS_KEY=${AWS_S3_ACCESS_KEY}
      - AWS_S3_SECRET_KEY=${AWS_S3_SECRET_KEY}
      # JWT 토큰 설정
      - JWT_SECRET=${JWT_SECRET}
      # 이메일 설정
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      # CTF 인스턴스 서브도메인 프록시 (inst-{uuid}.{도메인}). 비어 있으면 꺼진다.
      - CTF_INSTANCE_BASE_DOMAIN=${CTF_INSTANCE_BASE_DOMAIN:-}
      # 인증 쿠키를 인스턴스 서브도메인에도 보내려면 상위 도메인을 건다. 비어 있으면 host-only.
      - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN:-}
    restart: always

  nginx:
    image: nginx:alpine
    container_name: nimda-nginx
    depends_on:
      - backend-blue
      - backend-green
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
    networks:
      - nimda-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro # nginx 설정 파일 마운트
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      # blue - green의 주소가 담긴 설정 파일
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    restart: always

# 볼륨 정의 (데이터 영속성)
volumes:
  mysql_data:
  redis_data:
  certbot-www: # Let's Encrypt 인증용 웹루트
  certbot-conf: # Let's Encrypt 인증서 저장소

# 도커 컨테이너 네트워크 설정
networks:
  nimda-network:
    # 이름을 고정해야 Judge Server compose가 external로 이 망에 붙는다.
    # (기본값은 프로젝트명이 붙어 {프로젝트}_nimda-network가 된다)
    name: nimda-network
    driver: bridge
  # Judge Server가 --internal로 미리 만든다. 없으면 backend가 뜨지 않는다.
  ctf-instances:
    external: true