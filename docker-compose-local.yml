services:
  mysql:
    image: mysql:8.0
    container_name: nimda-mysql
    networks:
      - nimda-network
    restart: always
    environment:
      # .env의 MYSQL_USER가 root라 별도 사용자(MYSQL_USER/MYSQL_PASSWORD)는 만들지 않는다.
      # mysql 이미지는 MYSQL_USER=root를 거부하고 기동에 실패한다.
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      # 메모리 설정 최적화 (1GB RAM 환경)
      MYSQL_INNODB_BUFFER_POOL_SIZE: 256M
    expose:
      - "3306" # DB 외부 접근 차단
    volumes:
      - mysql_data:/var/lib/mysql
      # 윈도우 로컬 MySQL에서 뽑은 덤프. 컨테이너가 "처음" 뜰 때(=mysql_data 볼륨이 비었을 때)
      # 파일 이름 순서대로 자동 실행된다. 다시 넣으려면 down -v로 볼륨을 지워야 한다.
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    container_name: nimda-redis
    restart: always
    command: redis-server
    # 로컬 테스트에서는 다른 프로젝트(Go 조율자 등)와 IDE 실행도 같은 Redis를 봐야 한다.
    # 127.0.0.1에만 묶어 외부 노출은 막는다. (운영 compose는 expose만 유지)
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - nimda-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 단일 백엔드 서버로 통합 (명칭 변경)
  backend:
    # 로컬 테스트는 지금 소스를 빌드해서 쓴다.
    # (레지스트리의 xtkww971/nimda-backend:latest는 오래된 이미지라 새 API가 없다)
    build:
      context: ./backend-spring
      dockerfile: Dockerfile
    image: nimda-backend:local
    container_name: nimda-backend
    # DB 실행 조건 설정
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 로컬에서 Nginx 없이 직접 API 테스트가 가능하도록 포트 매핑 (선택 사항)
    ports:
      - "8080:8080"
    networks:
      - nimda-network
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:8080/error" ]
      interval: 10s
      timeout: 5s
      retries: 5
      # 기동에 50초 이상 걸린다. 짧으면 --wait이 아직 뜨는 중인 앱을 unhealthy로 본다.
      start_period: 90s

    environment:
      - SPRING_PROFILES_ACTIVE=local
      # 시간대 설정
      - TZ=Asia/Seoul
      # MySQL
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      # Spring Boot 포트 설정
      - SERVER_PORT=8080
      # AWS S3 설정
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_S3_REGION=${AWS_S3_REGION}
      - AWS_S3_ACCESS_KEY=${AWS_S3_ACCESS_KEY}
      - AWS_S3_SECRET_KEY=${AWS_S3_SECRET_KEY}
      # JWT 토큰 설정
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_FLYWAY_ENABLED=false
    restart: always

  nginx:
    image: nginx:alpine
    container_name: nimda-nginx
    # 의존성을 단일 백엔드로 수정
    depends_on:
      - backend
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
    networks:
      - nimda-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    restart: always

volumes:
  mysql_data:
  redis_data:
  certbot-www:
  certbot-conf:

networks:
  nimda-network:
    # 이름을 고정해야 다른 compose 프로젝트가 external로 이 망에 붙을 수 있다.
    # (기본값은 프로젝트명이 붙어 nimda_nimda-network가 된다)
    name: nimda-network
    driver: bridge