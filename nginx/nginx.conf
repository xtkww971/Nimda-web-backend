# CPU 코어 당 저장할 소켓의 수
events {
    worker_connections 1024;
}

http {
    # 프로토콜 통신 시 사용하는 데이터 타입 include
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # [Rate Limit 설정]
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # CTF 인스턴스용. 문제 풀이(브루트포스·blind SQLi)는 요청이 많아 API보다 넉넉히 둔다.
    limit_req_zone $binary_remote_addr zone=inst_limit:10m rate=30r/s;

    # 업로드 최대 크기. Spring multipart(max-request-size: 10MB)와 맞춘다. (기본값 1m)
    client_max_body_size 10m;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # 서버 주소 변수화
    upstream backend {
        include /etc/nginx/conf.d/active-backend.inc;
    }

    # HTTP 서버
    server {
        listen 80;
        server_name api.nimda.kr 43.200.36.32 *.nimda.kr;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # HTTP를 HTTPS로 리다이렉트
        location / {
            # 도메인 요청은 전부 HTTPS로 리다이렉트 (api, inst-* 포함)
            # 인증 쿠키가 Secure라 http로 받으면 쿠키가 안 실린다. 필터를 우회하는 http 경로도 막는다.
            if ($host ~* \.nimda\.kr$) {
                return 301 https://$host$request_uri;
            }
            # 클라이언트 정보 재기입
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # HTTPS 서버 (API). 첫 443 블록이라 다른 블록에 안 맞는 호스트도 여기로 온다(기본 서버).
    server {
        listen 443 ssl; # 암호화 유무 판단을 위한 ssl 설정
        http2 on;
        server_name api.nimda.kr;

        # 와일드카드 인증서 (*.nimda.kr 이 api.nimda.kr 을 포함한다). 예전 live/api.nimda.kr 인증서는
        # 2026-08-01 에 만료돼 갱신되지 않고 있다. 와일드카드 하나만 갱신하면 되게 inst-*, game 블록과 같은 파일을 쓴다.
        ssl_certificate /etc/letsencrypt/live/nimda.kr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nimda.kr/privkey.pem;

        # 보안 헤더
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # [보안 필터링]
        if ($query_string ~* "(<|%3C).*script.*(>|%3E)") { return 403; }
        if ($query_string ~* "union.*select") { return 403; }
        if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS)$ ) { return 405; }

        # 민감 파일 접근 금지
        location ~* \.(env|log|git|sh|bak|php|sql)$ {
            deny all;
        }

        # API 요청
        location /api {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 그 외 모든 요청
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS 서버 (CTF 인스턴스: inst-{uuid}.nimda.kr)
    # 문제 트래픽은 공격 페이로드 자체가 정답 경로다. 위 API 블록의 쿼리 필터·확장자 차단·보안 헤더를
    # 걸면 SQLi/XSS/.php 문제가 nginx에서 막힌다. 그래서 블록을 나누고 그대로 backend로 넘긴다.
    # 소유권 검사와 플랫폼 쿠키 제거는 backend의 SubdomainInstanceProxyFilter가 한다.
    #
    # inst-{토큰}.nimda.kr 에만 맞춘다. *.nimda.kr로 열면 아무 서브도메인으로 API 필터를 우회할 수 있다.
    server {
        listen 443 ssl;
        http2 on;
        server_name ~^inst-[^.]+\.nimda\.kr$;

        # 와일드카드 인증서 (*.nimda.kr, DNS-01로 발급). 파일이 없으면 nginx가 안 뜬다 — RB-0001 단계 5 먼저.
        ssl_certificate /etc/letsencrypt/live/nimda.kr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nimda.kr/privkey.pem;

        location / {
            limit_req zone=inst_limit burst=100 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # HTTPS 서버 (CTF 게임: game.nimda.kr). 게임은 이벤트 때만 켠다 (Nimda-ctf-game 레포 deploy/ctf-game.sh, 서버 ~/ctf-game).
    # 꺼져 있어도 nginx 는 떠야 한다. proxy_pass 에 이름을 바로 쓰면 nginx 가 시작·reload 때 이름을 찾다가
    # 실패해 전체(API 포함)가 멈추므로, 변수로 두고 요청 때 Docker DNS(127.0.0.11)로 찾는다.
    server {
        listen 443 ssl;
        http2 on;
        server_name game.nimda.kr;

        # 와일드카드 인증서 (*.nimda.kr). inst-* 블록과 같은 파일
        ssl_certificate /etc/letsencrypt/live/nimda.kr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nimda.kr/privkey.pem;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ctf_game http://ctf-game:8080;

        # 게임 WebSocket. 접속이 길게 유지되므로 읽기 시간 제한을 늘린다 (서버가 주기적으로 상태를 보낸다).
        # 로그인 쿠키(Authorization, Domain=nimda.kr)가 이 연결 요청에 실려 게임 서버가 Nimda 계정을 확인한다.
        location /ws {
            proxy_pass $ctf_game;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            # 게임 서버는 사설망(nginx)에서 온 연결의 X-Forwarded-For 마지막 값을 사용자 IP 로 쓴다
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 게임 페이지·JS·소리 (게임 서버가 직접 서빙)
        location / {
            limit_req zone=inst_limit burst=100 nodelay;
            proxy_pass $ctf_game;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 게임이 꺼져 있으면(이름을 못 찾거나 연결 거부) 안내 페이지
        error_page 502 504 = @ctf_game_off;
        location @ctf_game_off {
            default_type text/html;
            charset utf-8;
            return 503 '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>NIMDA CTF</title><body style="background:#000;color:#ccc;font-family:sans-serif;display:grid;place-items:center;height:100vh;margin:0"><p>CTF 게임은 지금 열려 있지 않습니다.</p></body>';
        }
    }
}